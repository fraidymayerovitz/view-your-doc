<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#070808"/>
      <stop offset="100%" stop-color="#0e0f10"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <!-- subtle binary background -->
  <g opacity="0.06" fill="#ffffff">
    <text x="50" y="60" font-family="monospace" font-size="18">0101010101010101010101010101010101</text>
    <text x="50" y="90" font-family="monospace" font-size="18">1010101010101010101010101010101010</text>
    <text x="50" y="120" font-family="monospace" font-size="18">0101010101010101010101010101010101</text>
    <text x="50" y="150" font-family="monospace" font-size="18">1010101010101010101010101010101010</text>
  </g>

  <!-- ICON -->
  <g transform="translate(60,50)">
    <text x="0" y="90" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="120" fill="#ffffff">ICON</text>
  </g>

  <!-- small red bar as in original -->
  <rect x="640" y="42" width="34" height="8" rx="2" ry="2" fill="#e53935" />

  <!-- TECH -->
  <g transform="translate(680,50)">
    <text x="0" y="90" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="120" fill="#ffffff">TECH</text>
  </g>

  <!-- GROUP under -->
  <text x="60" y="200" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="34" fill="#d6e3ea" letter-spacing="10">GROUP</text>
</svg>
